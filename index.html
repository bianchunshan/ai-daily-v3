<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e60012" />
    <meta
      name="description"
      content="前沿科技日报：人工智能、半导体、机器人与科学进展，中文摘要、原文来源和 AI 问答。"
    />
    <meta property="og:title" content="前沿科技日报" />
    <meta property="og:type" content="website" />
    <title>前沿科技日报</title>
    <link rel="stylesheet" href="/assets/theme.css?v=20260905c" />
    <script src="/assets/vendor/marked.js" defer></script>
    <script src="/assets/vendor/purify.js" defer></script>
    <script src="/assets/app.js?v=20260905c" defer></script>
    <script src="/assets/home.js?v=20260905c" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-main">
        <a class="logo" href="/"
          ><span class="mark">前沿</span><span>科技日报</span></a
        >
        <div class="topbar-actions">
          <button
            class="icon-btn"
            id="searchBtn"
            title="搜索"
            aria-label="搜索"
          >
            <span
              class="ui-icon"
              style="--icon: url(/assets/icons/search.svg)"
            ></span></button
          ><button
            class="icon-btn"
            id="themeBtn"
            title="切换主题"
            aria-label="切换主题"
          >
            <span
              class="ui-icon"
              style="--icon: url(/assets/icons/sun-moon.svg)"
            ></span>
          </button>
        </div>
      </div>
      <nav class="tabs" id="tabs" aria-label="资讯分类"></nav>
    </header>
    <main class="wrap home-wrap">
      <div class="update-bar">
        <button
          id="updateStatus"
          aria-expanded="false"
          aria-controls="updateInfo"
        >
          正在读取更新状态</button
        ><button
          class="icon-btn"
          id="refreshBtn"
          title="刷新资讯"
          aria-label="刷新资讯"
        >
          <span
            class="ui-icon"
            style="--icon: url(/assets/icons/refresh-cw.svg)"
          ></span>
        </button>
      </div>
      <div id="updateInfo" class="update-info" hidden></div>
      <button id="newNews" class="new-news" hidden></button>
      <section class="search-area" id="searchBar" hidden>
        <label class="search-field"
          ><span
            class="ui-icon"
            style="--icon: url(/assets/icons/search.svg)"
          ></span
          ><input
            type="search"
            id="searchInput"
            placeholder="搜索全部历史资讯"
            aria-label="搜索全部历史资讯" /><button
            class="icon-btn"
            id="searchClear"
            title="关闭搜索"
            aria-label="关闭搜索"
          >
            <span
              class="ui-icon"
              style="--icon: url(/assets/icons/x.svg)"
            ></span></button
        ></label>
        <div class="filters">
          <label
            >来源<select id="sourceFilter">
              <option value="">全部来源</option>
            </select></label
          ><label>起始日期<input type="date" id="fromFilter" /></label
          ><label>截止日期<input type="date" id="toFilter" /></label>
        </div>
      </section>
      <div class="home-columns">
        <section class="news-column">
          <div id="digest"></div>
          <div class="section-title">
            <h1 id="feedTitle">最新资讯</h1>
            <span id="resultCount"></span>
          </div>
          <div id="feed" class="feed"><div class="empty">加载中…</div></div>
          <button id="more" class="more-btn" hidden>加载更多</button>
        </section>
        <aside class="side-column">
          <h2>今日重点</h2>
          <div id="highlights"></div>
          <p class="aside-note">依据今日综述选取</p>
          <h2>更新记录</h2>
          <div id="updateDetails"></div>
        </aside>
      </div>
    </main>
    <nav class="tabbar">
      <a class="tabbar-btn active" href="/"
        ><span
          class="ui-icon"
          style="--icon: url(/assets/icons/newspaper.svg)"
        ></span
        ><span>资讯</span></a
      ><a class="tabbar-btn" href="stock.html"
        ><span
          class="ui-icon"
          style="--icon: url(/assets/icons/chart-no-axes-combined.svg)"
        ></span
        ><span>行情</span></a
      ><button class="tabbar-btn" id="savedBtn">
        <span
          class="ui-icon"
          style="--icon: url(/assets/icons/bookmark.svg)"
        ></span
        ><span>收藏</span></button
      ><button class="tabbar-btn" id="chatBtn">
        <span
          class="ui-icon"
          style="--icon: url(/assets/icons/message-circle.svg)"
        ></span
        ><span>问 AI</span>
      </button>
    </nav>
  </body>
</html>
