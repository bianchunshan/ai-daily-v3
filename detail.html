<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#087f82" />
    <meta name="description" content="前序 · 资讯详情" />
    <meta property="og:title" content="资讯详情 · 前序" />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="前序" />
    <title>资讯详情 · 前序</title>
    <link rel="icon" type="image/png" href="/assets/brand/qianxu-symbol-v1.png" />
    <link rel="apple-touch-icon" href="/assets/brand/qianxu-symbol-v1.png" />
    <link rel="stylesheet" href="assets/theme.css?v=20260905-brand1" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem("theme");
          var d = s
            ? s === "dark"
            : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute(
            "data-theme",
            d ? "dark" : "light",
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <header class="detail-head">
      <button
        class="icon-btn"
        aria-label="返回"
        onclick="
          history.length > 1 ? history.back() : (location.href = 'index.html')
        "
      >
        <span
          class="ui-icon"
          style="--icon: url(/assets/icons/arrow-left.svg)"
        ></span>
      </button>
      <div class="ht page-identity"><a class="page-brand" href="/" aria-label="前序首页"><img src="/assets/brand/qianxu-symbol-v1.png" width="30" height="30" alt="" /><span>前序</span></a><span class="page-kind">资讯详情</span></div>
      <button class="icon-btn head-ask" id="askBtn" aria-label="问AI">
        <span
          class="ui-icon"
          style="--icon: url(/assets/icons/message-circle.svg)"
        ></span>
      </button>
    </header>

    <article class="article" id="article">
      <div class="empty">加载中…</div>
    </article>

    <nav class="tabbar">
      <a class="tabbar-btn" href="index.html"
        ><span
          class="ui-icon"
          style="--icon: url(/assets/icons/newspaper.svg)"
        ></span
        ><span>首页</span></a
      >
      <a class="tabbar-btn" href="stock.html"
        ><span
          class="ui-icon"
          style="--icon: url(/assets/icons/chart-no-axes-combined.svg)"
        ></span
        ><span>行情</span></a
      >
      <button class="tabbar-btn" id="chatBtn">
        <span
          class="ui-icon"
          style="--icon: url(/assets/icons/message-circle.svg)"
        ></span
        ><span>问AI</span>
      </button>
    </nav>

    <script src="assets/vendor/marked.js"></script>
    <script src="assets/vendor/purify.js"></script>
    <script src="assets/app.js?v=20260905c"></script>
    <script>
      var FALLBACK_NEWS = [
        {
          id: 1,
          title: "出口管制重塑全球芯片供应链",
          summary:
            "关键技术和先进制程设备成为地缘科技竞争焦点，企业供应链布局面临调整。",
          category: "地缘科技",
          tags: ["出口管制"],
          source: "示例资讯",
          time: "2小时前",
          url: "#",
          stocks: [],
        },
      ];
      var A = window.AID;
      var CURRENT = null;

      function renderArticle(news, bodyText) {
        var el = document.getElementById("article");
        document.title = news.title + " · 前序";
        try {
          var og = document.querySelector('meta[property="og:title"]');
          if (og) og.setAttribute("content", news.title);
        } catch (e) {}

        var html = "<h1>" + A.esc(news.title) + "</h1>";
        html +=
          '<div class="article-meta"><span class="chip">' +
          A.esc(news.category) +
          "</span>" +
          (news.source ? "<span>" + A.esc(news.source) + "</span>" : "") +
          (A.relTime(news.ts) || news.time
            ? '<span class="dot"></span><span>' +
              A.esc(A.relTime(news.ts) || news.time) +
              "</span>"
            : "") +
          "</div>";
        html += A.coverHTML(news, { eager: true });

        var fallbackBody =
          news.summary || "这条资讯的正文暂未整理完成,可先查看原文报道。";
        var rawBody =
          (bodyText && String(bodyText).trim()) ||
          (news.body && news.body.trim()) ||
          "";
        var paras = rawBody ? rawBody.split(/\n+/) : [fallbackBody];
        var body = '<div class="article-body">';
        paras.forEach(function (p) {
          if (p.trim()) body += "<p>" + A.esc(p.trim()) + "</p>";
        });
        body += "</div>";
        html += body;

        var stocks = A.strongStocks(news);
        var weak = (news.stocks || []).filter(function (s) {
          return s && s.name && s.confidence === "low";
        });
        if (stocks.length) {
          html += '<div class="stockbox"><h3>关联标的 · AI 推断</h3>';
          stocks.forEach(function (s) {
            var href = s.ticker
              ? "stock.html?symbol=" + encodeURIComponent(s.ticker)
              : "stock.html";
            var conf = s.confidence ? " · " + A.esc(s.confidence) : "";
            var t = s.ticker
              ? ' <span class="stock-pill rel">' +
                A.esc(s.ticker) +
                conf +
                "</span>"
              : "";
            html +=
              '<a class="row" href="' +
              href +
              '"><div><span class="nm">' +
              A.esc(s.name) +
              "</span>" +
              t +
              (s.reason
                ? '<div style="font-size:12.5px;color:var(--text-3);margin-top:4px;line-height:1.5">' +
                  A.esc(s.reason) +
                  "</div>"
                : "") +
              "</div></a>";
          });
          html += "</div>";
        }
        if (weak.length) {
          html +=
            '<details class="weak-stocks"><summary>弱关联标的 ' +
            weak.length +
            ' 个</summary><div class="stockbox" style="margin-top:8px">';
          weak.forEach(function (s) {
            var href = s.ticker
              ? "stock.html?symbol=" + encodeURIComponent(s.ticker)
              : "stock.html";
            html +=
              '<a class="row" href="' +
              href +
              '"><div><span class="nm">' +
              A.esc(s.name) +
              "</span>" +
              (s.ticker
                ? ' <span class="stock-pill rel">' + A.esc(s.ticker) + "</span>"
                : "") +
              (s.reason
                ? '<div style="font-size:12.5px;color:var(--text-3);margin-top:4px;line-height:1.5">' +
                  A.esc(s.reason) +
                  "</div>"
                : "") +
              "</div></a>";
          });
          html += "</div></details>";
        }

        var sourceUrl = A.safeUrl(news.url);
        if (sourceUrl && sourceUrl !== "#") {
          html +=
            '<div class="srclink"><a href="' +
            A.esc(sourceUrl) +
            '" target="_blank" rel="noopener noreferrer">查看原文报道 →</a></div>';
        }
        html +=
          '<button type="button" class="ask-cta" id="askCta">基于这篇提问</button>';
        html +=
          '<div class="article-actions"><button class="text-btn" id="saveArticle">' +
          A.icon("bookmark") +
          (A.isBookmarked(news.id) ? "已收藏" : "收藏") +
          '</button><button class="text-btn" id="shareArticle">' +
          A.icon("share-2") +
          '分享</button></div><section id="related"><h2>相关进展</h2><div id="relatedItems"></div></section>';

        el.innerHTML = html;
        var cov = el.querySelector(".cover");
        if (cov) {
          cov.style.aspectRatio = "16 / 9";
          cov.style.marginBottom = "18px";
        }
        var cta = document.getElementById("askCta");
        if (cta)
          cta.onclick = function () {
            A.openChat({ focus: news });
          };
        document.getElementById("saveArticle").onclick = function () {
          var active = A.toggleBookmark(news);
          this.innerHTML = A.icon("bookmark") + (active ? "已收藏" : "收藏");
        };
        document.getElementById("shareArticle").onclick = async function () {
          try {
            if (navigator.share)
              await navigator.share({ title: news.title, url: location.href });
            else {
              await navigator.clipboard.writeText(location.href);
              this.textContent = "链接已复制";
            }
          } catch (e) {}
        };
        A.request({
          q: (news.tags || []).slice(0, 2).join(" ") || news.title,
          limit: 6,
        })
          .then(function (d) {
            var related = d.items.filter(function (n) {
              return n.id !== news.id;
            });
            document.getElementById("relatedItems").innerHTML = related
              .map(function (n) {
                return (
                  '<a class="highlight" href="detail.html?id=' +
                  n.id +
                  '"><small>' +
                  A.esc(A.dateLabel(n.ts)) +
                  " · " +
                  A.esc(n.source) +
                  "</small><strong>" +
                  A.esc(n.title) +
                  "</strong></a>"
                );
              })
              .join("");
            document.getElementById("related").hidden = !related.length;
          })
          .catch(function () {
            document.getElementById("related").hidden = true;
          });
      }

      function openAsk() {
        if (CURRENT) A.openChat({ focus: CURRENT });
        else A.openChat();
      }

      A.bindChatControls();
      document.getElementById("chatBtn").onclick = openAsk;
      document.getElementById("askBtn").onclick = openAsk;

      (function () {
        var id = A.getParam("id");
        var el = document.getElementById("article");
        A.findNewsById([], id, function (news) {
          if (!news) {
            el.innerHTML =
              '<div class="empty">未找到这条新闻<br><br><a class="srclink" href="index.html" style="color:var(--brand-ink)">← 返回首页</a></div>';
            return;
          }
          CURRENT = news;
          A.markRead(news.id);
          renderArticle(news, news.body || "");
          if (!news.body) {
            A.loadBody(news.id).then(function (body) {
              if (body) renderArticle(news, body);
            });
          }
        });
      })();
    </script>
  </body>
</html>
