<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e60012">
  <title>资讯详情 · 前沿科技日报</title>
  <link rel="stylesheet" href="assets/theme.css">
  <script>
    (function () {
      try {
        var s = localStorage.getItem('theme');
        var d = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="detail-head">
    <div class="back" onclick="history.length > 1 ? history.back() : location.href='index.html'">←</div>
    <div class="ht">资讯详情</div>
  </header>

  <article class="article" id="article">
    <div class="empty">加载中…</div>
  </article>

  <script src="assets/app.js"></script>
  <script>
    var FALLBACK_NEWS = [
      { id: 1, title: "本田因电动车项目取消首次出现财务亏损", summary: "这家标志性汽车巨头称其未来不确定，巨额财务亏损归咎于中国和美国市场。", category: "国际局势", tags: ["汽车"], source: "澳大利亚新闻", time: "2小时前", url: "#", stocks: [{ name: "本田", change: "-3.2%", trend: "down", price: "78.50" }] }
    ];
    var A = window.AID;

    function fmtPrice(s) { return s.price ? s.price : '—'; }

    function render(list) {
      var id = A.getParam('id');
      var el = document.getElementById('article');
      var news = null;
      for (var i = 0; i < list.length; i++) { if (String(list[i].id) === String(id)) { news = list[i]; break; } }
      if (!news) { el.innerHTML = '<div class="empty">未找到这条新闻<br><br><a class="srclink" href="index.html" style="color:var(--brand-ink)">← 返回首页</a></div>'; return; }

      document.title = news.title + ' · 前沿科技日报';

      var html = A.coverHTML(news, { label: true });
      html += '<h1>' + A.esc(news.title) + '</h1>';
      html += '<div class="article-meta"><span class="chip">' + A.esc(news.category) + '</span>' +
        (news.source ? '<span>' + A.esc(news.source) + '</span>' : '') +
        (news.time ? '<span class="dot"></span><span>' + A.esc(news.time) + '</span>' : '') +
        '<span class="dot"></span><span>💬 ' + A.comments(news) + '</span>' +
        '<span class="dot"></span><span>🔥 ' + A.heat(news) + '°</span></div>';

      var body = '<div class="article-body">';
      body += '<p>' + A.esc(news.summary || '') + '</p>';
      if (news.tags && news.tags.length) {
        body += '<p>本则资讯涉及：' + news.tags.map(A.esc).join('、') + '。</p>';
      }
      body += '<p>据' + A.esc(news.source || '相关媒体') + '报道，该事件已引发业界关注。完整内容请通过文末原文链接查看权威来源。</p>';
      body += '</div>';
      html += body;

      if (news.stocks && news.stocks.length) {
        html += '<div class="stockbox"><h3>📈 关联标的</h3>';
        news.stocks.forEach(function (s) {
          var cls = s.trend === 'up' ? 'up' : 'down';
          html += '<div class="row"><span class="nm">' + A.esc(s.name) + '</span>' +
            '<span class="stock-pill ' + cls + '">' + fmtPrice(s) + ' · ' + A.esc(s.change) + '</span></div>';
        });
        html += '</div>';
      }

      if (news.url && news.url !== '#') {
        html += '<div class="srclink"><a href="' + A.esc(news.url) + '" target="_blank" rel="noopener">查看原文报道 →</a></div>';
      }

      el.innerHTML = html;
      var cov = el.querySelector('.cover');
      if (cov) { cov.style.height = '190px'; cov.style.borderRadius = '14px'; cov.style.marginBottom = '18px'; }
    }

    A.loadNews(FALLBACK_NEWS, render);
  </script>
</body>
</html>
