name: 每10分钟更新新闻

on:
  schedule:
    # GitHub Actions schedule 会漏触发/延迟；拆成多条 10 分钟触发点，避免单条列表表达式整段空窗。
    # 若没有新 URL，脚本会提前退出；若数据无变化，提交和部署也会跳过。
    - cron: '7 * * * *'
    - cron: '17 * * * *'
    - cron: '27 * * * *'
    - cron: '37 * * * *'
    - cron: '47 * * * *'
    - cron: '57 * * * *'
  workflow_dispatch: {}        # 支持在 Actions 页面手动触发

permissions:
  contents: write              # 允许工作流 push 回仓库

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25        # 富化卡住时尽早失败,避免挂死堵住后续 run
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 + Kimi 中文 AI 富化（仅用标准库，无需 pip 依赖）
        env:
          ENRICH_PROVIDER: kimi
          KIMI_KEY: ${{ secrets.KIMI_KEY }}
          KIMI_MODEL: kimi-for-coding
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
        run: python3 enrich_news.py

      - name: 校验数据非空（防止把线上覆盖成空白）
        id: guard
        run: |
          COUNT=$(grep -c '"id"' news_data_latest.js || echo 0)
          echo "本次抓到 $COUNT 条新闻"
          if [ "$COUNT" -lt 10 ]; then
            echo "::warning::抓取结果少于 10 条，放弃本次更新，保留旧数据"
            git checkout -- news_data_latest.js
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 有变化才提交并推送到 GitHub
        id: commit
        if: steps.guard.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- news_data_latest.js; then
            echo "数据无变化，跳过提交与部署"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add news_data_latest.js seen_urls.json
            git commit -m "chore: 自动更新新闻（AI 中文富化）"
            # 防并发:push 被拒就 rebase(本次数据为准)重试,避免两次 run 撞车失败
            pushed=0
            for i in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              echo "push 被拒,rebase 重试 ($i)..."
              git pull --rebase -X theirs origin main || git rebase --abort
              sleep 2
            done
            if [ "$pushed" != "1" ]; then echo "::error::push 多次失败"; exit 1; fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 部署到 Vercel 生产环境（仅在有新数据时）
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
