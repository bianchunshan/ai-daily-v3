name: 每日更新新闻

on:
  schedule:
    - cron: '0 0 * * *'      # 每天 UTC 00:00（北京时间 08:00）运行
  workflow_dispatch: {}        # 支持在 Actions 页面手动触发

permissions:
  contents: write              # 允许工作流 push 回仓库

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 + Qwen 中文 AI 富化（仅用标准库，无需 pip 依赖）
        env:
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
        run: python3 enrich_news.py

      - name: 校验数据非空（防止把线上覆盖成空白）
        id: guard
        run: |
          COUNT=$(grep -c '"id"' news_data_latest.js || echo 0)
          echo "本次抓到 $COUNT 条新闻"
          if [ "$COUNT" -lt 10 ]; then
            echo "::warning::抓取结果少于 10 条，放弃本次更新，保留旧数据"
            git checkout -- news_data_latest.js
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 有变化才提交并推送到 GitHub
        id: commit
        if: steps.guard.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- news_data_latest.js; then
            echo "数据无变化，跳过提交与部署"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add news_data_latest.js
            git commit -m "chore: 每日自动更新新闻（AI 中文富化）"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 部署到 Vercel 生产环境（仅在有新数据时）
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
