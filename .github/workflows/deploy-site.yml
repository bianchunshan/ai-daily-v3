name: 定时部署站点与数据

on:
  schedule:
    # 每 30 分钟把最新代码 + data/ 数据一起部署到 Vercel(数据与站点同源,浏览器走 ETag 缓存)。
    # 错开新闻更新的 :07/:37,留出数据 push 的时间;Vercel Hobby 每日部署上限 100,48 次/天有余量。
    - cron: '13,43 * * * *'
  workflow_dispatch: {}

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署到 Vercel 生产环境
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
