<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e60012">
  <title>实时行情 · 前沿科技日报</title>
  <meta name="description" content="前沿科技日报实时行情:当日资讯关联标的的 A股/港股/美股行情。">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/theme.css?v=20260703a">
  <script>
    (function () {
      try {
        var s = localStorage.getItem('theme');
        var d = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <style>
    .q-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin: 12px; }
    .q-hero { padding: 22px 18px; }
    .q-name { font-size: 18px; font-weight: 700; color: var(--text); }
    .q-sym { font-size: 12px; color: var(--text-3); margin-left: 6px; font-weight: 500; }
    .q-mkt { font-size: 11px; color: var(--text-3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; margin-left: 8px; }
    .q-price { font-size: 34px; font-weight: 800; margin: 10px 0 2px; letter-spacing: -.5px; }
    .q-chg { font-size: 15px; font-weight: 700; }
    .q-time { font-size: 12px; color: var(--text-3); margin-top: 8px; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .q-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-top: 1px solid var(--border); cursor: pointer; }
    .q-row:first-child { border-top: none; }
    .q-row .l .nm { font-size: 15px; font-weight: 600; color: var(--text); }
    .q-row .l .sy { font-size: 12px; color: var(--text-3); }
    .q-row .r { text-align: right; }
    .q-row .r .p { font-size: 15px; font-weight: 700; color: var(--text); }
    .q-row .r .c { font-size: 12px; font-weight: 700; }
    .note { font-size: 12px; color: var(--text-3); line-height: 1.6; margin: 6px 16px 4px; }
    .rel-news { margin: 4px 12px; }
    .rel-news a { display: block; font-size: 14px; color: var(--text-2); padding: 10px 4px; border-top: 1px solid var(--border); line-height: 1.5; }
  </style>
</head>
<body>
  <header class="detail-head">
    <div class="back" onclick="history.length > 1 ? history.back() : location.href='index.html'">←</div>
    <div class="ht">实时行情</div>
  </header>

  <main class="wrap" id="main"><div class="empty">加载中…</div></main>

  <nav class="tabbar">
    <a class="tabbar-btn" href="index.html"><span class="ti">📰</span><span>首页</span></a>
    <a class="tabbar-btn active" href="stock.html"><span class="ti">📈</span><span>行情</span></a>
    <a class="tabbar-btn" href="index.html?chat=1"><span class="ti">💬</span><span>问AI</span></a>
    <div class="tabbar-btn" id="themeBtn"><span class="ti">🌓</span><span>主题</span></div>
  </nav>

  <script src="assets/app.js?v=20260703a"></script>
  <script>
    var A = window.AID;
    document.getElementById('themeBtn').onclick = function () { A.toggleTheme(); };

    function chgCls(v) { return v >= 0 ? 'up' : 'down'; }
    function chgStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
    function priceStr(q) { return q.currency + q.price; }

    async function getQuotes(symbols) {
      if (!symbols.length) return { quotes: [], note: '' };
      try {
        var r = await fetch('/api/quote?symbol=' + encodeURIComponent(symbols.join(',')));
        if (!r.ok) return { quotes: [], note: '', error: 'HTTP ' + r.status };
        return await r.json();
      } catch (e) { return { quotes: [], note: '', error: String(e) }; }
    }

    function heroCard(q) {
      var c = chgCls(q.changePercent);
      return '<div class="q-card q-hero">' +
        '<div><span class="q-name">' + A.esc(q.name) + '</span><span class="q-sym">' + A.esc(q.symbol) + '</span>' +
        '<span class="q-mkt">' + q.market + '</span></div>' +
        '<div class="q-price ' + c + '">' + A.esc(priceStr(q)) + '</div>' +
        '<div class="q-chg ' + c + '">' + chgStr(q.changePercent) + '</div>' +
        '<div class="q-time">' + A.esc(q.time || '') + '</div></div>';
    }

    function listRows(quotes) {
      var h = '<div class="q-card" style="padding:0">';
      quotes.forEach(function (q) {
        var c = chgCls(q.changePercent);
        h += '<div class="q-row" onclick="location.href=\'stock.html?symbol=' + encodeURIComponent(q.symbol) + '\'">' +
          '<div class="l"><div class="nm">' + A.esc(q.name) + '</div><div class="sy">' + A.esc(q.symbol) + ' · ' + q.market + '</div></div>' +
          '<div class="r"><div class="p">' + A.esc(priceStr(q)) + '</div><div class="c ' + c + '">' + chgStr(q.changePercent) + '</div></div>' +
          '</div>';
      });
      return h + '</div>';
    }

    function noteHTML(d) {
      return '<div class="note">' + (d.error ? '⚠️ 行情服务暂不可用(' + A.esc(d.error) + ')<br>' : '') +
        A.esc(d.note || 'A股/港股盘中接近实时,美股约延迟15分钟 · 来源:新浪财经') + '</div>';
    }

    function relatedNews(symbol, news) {
      var hit = (news || []).filter(function (n) {
        return (n.stocks || []).some(function (s) { return s.ticker === symbol; });
      });
      if (!hit.length) return '';
      var h = '<div class="section-title"><span class="bar"></span>相关资讯</div><div class="rel-news">';
      hit.slice(0, 20).forEach(function (n) { h += '<a href="detail.html?id=' + encodeURIComponent(String(n.id)) + '">' + A.esc(n.title) + '</a>'; });
      return h + '</div>';
    }

    (function () {
      var main = document.getElementById('main');
      var symbol = A.getParam('symbol');

      if (symbol) {
        // 单标的页:行情先出,相关资讯用小的热索引补充(不阻塞行情)
        (async function () {
          var d = await getQuotes([symbol]);
          var q = (d.quotes || [])[0];
          main.innerHTML = (q ? heroCard(q) : '<div class="empty">未找到 ' + A.esc(symbol) + ' 的行情</div>') +
            noteHTML(d) + '<div id="rel"></div>';
          A.fetchJSON('data/index-hot.json', 10000).then(function (idx) {
            document.getElementById('rel').innerHTML = relatedNews(symbol, idx && idx.items);
          }).catch(function () {});
        })();
      } else {
        // 行情 tab:直接读管线产出的当日标的清单(几 KB),不再下载新闻数据
        (async function () {
          var syms = [];
          try {
            var tk = await A.fetchJSON('data/tickers.json', 10000);
            syms = (tk || []).map(function (t) { return t.ticker; }).filter(Boolean);
          } catch (e) {}
          if (!syms.length) { main.innerHTML = '<div class="empty">今日资讯暂无关联标的</div>'; return; }
          var limit = 60;
          var d = await getQuotes(syms.slice(0, limit));
          var truncated = syms.length > limit ? '<div class="note">已展示前 ' + limit + ' 个标的,其余 ' + (syms.length - limit) + ' 个可从对应新闻详情进入。</div>' : '';
          main.innerHTML = '<div class="section-title"><span class="bar"></span>今日资讯关联标的</div>' +
            (d.quotes && d.quotes.length ? listRows(d.quotes) : '<div class="empty">行情加载失败</div>') +
            truncated + noteHTML(d);
        })();
      }
    })();
  </script>
</body>
</html>
